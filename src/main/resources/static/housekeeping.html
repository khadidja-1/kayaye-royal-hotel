<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kayaye Royal Hotel - Housekeeping</title>
    <script src="translations.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        /* MENU SANS CHEVAUCHEMENT */
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #1a252f; padding: 15px 20px; border-radius: 8px; flex-wrap: wrap; gap: 15px;}
        .nav-links { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;}
        .nav-links a { text-decoration: none; color: white; font-weight: bold; font-size: 14px;}
        .nav-links a.active { color: #d4af37; text-decoration: underline; }
        .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        .lang-selector { background: #d4af37; color: #1a252f; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer;}
        .btn-website { text-decoration: none; color: #2ecc71; font-weight: bold; font-size: 14px; white-space: nowrap;}
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap;}

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1a252f; color: #d4af37; }

        .status-cleaning { background-color: #ffc107; color: #333; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px;}
        .status-maintenance { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px;}
        .btn-clean { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-issue { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;}
        .empty-msg { text-align: center; color: #666; padding: 20px; }
        .issue-text { color: #dc3545; font-size: 12px; font-weight: bold; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <div class="nav-links">
            <a href="dashboard.html" data-translate="nav_dash">Dashboard</a>
            <a href="clients.html" data-translate="nav_clients">Clients</a>
            <a href="rooms.html" data-translate="nav_rooms">Rooms</a>
            <a href="reservations.html" data-translate="nav_bookings">Bookings</a>
            <a href="employees.html" data-translate="nav_employees">Employees</a>
            <a href="restaurant.html" data-translate="nav_rest">Restaurant</a>
            <a href="housekeeping.html" class="active" data-translate="nav_house">Housekeeping</a>
            <a href="inventory.html" data-translate="nav_inv">Inventory</a>
            <a href="events.html" data-translate="nav_events">Events</a>
        </div>
        <div class="nav-actions">
            <select class="lang-selector" onchange="applyTranslations(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
            </select>
            <a href="index.html" target="_blank" class="btn-website" data-translate="nav_website">🌐 View Website</a>
            <button class="btn-logout" onclick="logout()" data-translate="btn_logout">Logout</button>
        </div>
    </div>

    <h2 data-translate="house_title">Housekeeping & Maintenance</h2>
    <p data-translate="house_desc">Manage rooms that need cleaning or repairs.</p>

    <table>
        <thead>
        <tr>
            <th data-translate="th_room_num">Room Number</th>
            <th data-translate="th_type">Type</th>
            <th data-translate="th_status">Status</th>
            <th data-translate="th_actions">Action</th>
        </tr>
        </thead>
        <tbody id="housekeepingTableBody"></tbody>
    </table>
</div>

<script>
    function logout() { sessionStorage.removeItem('isLoggedIn'); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('preferredLang') || 'en';
        const selector = document.querySelector('.lang-selector');
        if(selector) selector.value = savedLang;
        applyTranslations(savedLang);
        loadDirtyRooms();
    });

    function loadDirtyRooms() {
        fetch('http://localhost:8081/api/rooms')
            .then(res => res.json())
            .then(rooms => {
                const tableBody = document.getElementById('housekeepingTableBody');
                tableBody.innerHTML = '';
                const roomsToHandle = rooms.filter(room => room.status === 'Cleaning' || room.status === 'Maintenance');
                if (roomsToHandle.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="empty-msg">All rooms are clean! ✨</td></tr>';
                    return;
                }
                roomsToHandle.forEach(room => {
                    let statusBadge = ""; let actionButtons = "";
                    if (room.status === 'Cleaning') {
                        statusBadge = `<span class="status-cleaning">Cleaning</span>`;
                        actionButtons = `<button class="btn-clean" onclick="updateRoomStatus(${room.id}, 'Available', null)">Mark as Clean</button>
                                         <button class="btn-issue" onclick="reportIssue(${room.id})">Report Issue</button>`;
                    } else if (room.status === 'Maintenance') {
                        statusBadge = `<span class="status-maintenance">Maintenance</span>`;
                        actionButtons = `<span class="issue-text">Issue: ${room.maintenanceReason || 'Unknown'}</span>
                                         <button class="btn-clean" onclick="updateRoomStatus(${room.id}, 'Available', null)" style="margin-top: 5px;">Mark as Fixed</button>`;
                    }
                    tableBody.innerHTML += `<tr><td><strong>${room.roomNumber}</strong></td><td>${room.type}</td><td>${statusBadge}</td><td>${actionButtons}</td></tr>`;
                });
            });
    }

    function reportIssue(id) {
        const issue = prompt("What is the problem with this room?");
        if (issue) updateRoomStatus(id, 'Maintenance', issue);
    }

    function updateRoomStatus(id, newStatus, reason) {
        fetch(`http://localhost:8081/api/rooms/${id}`)
            .then(res => res.json())
            .then(room => {
                room.status = newStatus;
                room.maintenanceReason = reason;
                return fetch(`http://localhost:8081/api/rooms/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(room) });
            })
            .then(res => { if (res.ok) loadDirtyRooms(); });
    }
</script>
</body>
</html>
