<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KAYAYE ROYAL HOTEL - Connexion</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542314831-c6a4d1424b18?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center;
        }
        .logo { font-size: 28px; font-weight: bold; color: #1a252f; margin-bottom: 5px; }
        .logo span { color: #d4af37; }
        .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .form-group input:focus { border-color: #d4af37; outline: none; }
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
        .options label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #555; }
        .options a { color: #d4af37; text-decoration: none; font-weight: bold; }
        .btn-login { width: 100%; padding: 14px; background: #1a252f; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #d4af37; color: #1a252f; }
        #error { color: #dc3545; font-size: 14px; margin-top: 15px; font-weight: bold; }
        .back-link { display: block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">KAYAYE <span>ROYAL</span> HOTEL</div>
    <div class="subtitle">Portail du Personnel</div>

    <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="Ex: admin" required>
    </div>

    <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
    </div>

    <div class="options">
        <label><input type="checkbox" id="rememberMe"> Se souvenir de moi</label>
        <a href="#" onclick="alert('Contactez le manager pour réinitialiser votre mot de passe.'); return false;">Mot de passe oublié ?</a>
    </div>

    <button class="btn-login" onclick="login()">Se Connecter</button>
    <p id="error"></p>

    <a href="index.html" class="back-link">← Retour au site web</a>
</div>

<script>
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error');
        const rememberMe = document.getElementById('rememberMe').checked;

        errorMsg.innerText = '';

        if (!username || !password) {
            errorMsg.innerText = "Veuillez entrer vos identifiants.";
            return;
        }

        fetch('http://localhost:8081/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(response => response.text())
        .then(result => {
            if (result === 'SUCCESS') {
                sessionStorage.setItem('isLoggedIn', 'true');
                if (rememberMe) { localStorage.setItem('savedUser', username); }
                else { localStorage.removeItem('savedUser'); }
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.innerText = 'Identifiant ou mot de passe incorrect.';
            }
        })
        .catch(error => {
            errorMsg.innerText = 'Erreur serveur. Le backend Java est-il lancé ?';
        });
    }

    window.onload = function() {
        const savedUser = localStorage.getItem('savedUser');
        if (savedUser) {
            document.getElementById('username').value = savedUser;
            document.getElementById('rememberMe').checked = true;
        }
    };
</script>

</body>
</html>
