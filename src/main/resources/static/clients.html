<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kayaye Royal Hotel - Clients</title>
    <script src="translations.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 20px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

        /* MENU 1 LIGNE */
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #1a252f; padding: 12px 20px; border-radius: 8px; }
        .nav-links { display: flex; gap: 12px; align-items: center;}
        .nav-links a { text-decoration: none; color: white; font-weight: bold; font-size: 14px;}
        .nav-links a.active { color: #d4af37; text-decoration: underline; }
        .lang-selector { background: #d4af37; color: #1a252f; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer;}
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .btn-website { text-decoration: none; color: #2ecc71; font-weight: bold; font-size: 14px; }
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }

        /* EN-TÊTE ET RECHERCHE */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        h2 { color: #333; margin: 0; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 250px; }
        .btn { padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; border: none; cursor: pointer;}

        /* TABLEAU PROPRE */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #1a252f; color: #d4af37; font-size: 14px; text-transform: uppercase;}
        tr:hover { background-color: #f1f1f1; }

        /* BOUTONS D'ACTION ALIGNÉS */
        .action-buttons { display: flex; gap: 5px; }
        .btn-edit { background-color: #ffc107; color: #333; padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-danger { background-color: #dc3545; padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white;}

        .client-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU 1 LIGNE -->
    <div class="nav">
        <div class="nav-links">
            <a href="dashboard.html" data-translate="nav_dash">Dashboard</a>
            <a href="clients.html" class="active" data-translate="nav_clients">Clients</a>
            <a href="rooms.html" data-translate="nav_rooms">Rooms</a>
            <a href="reservations.html" data-translate="nav_bookings">Bookings</a>
            <a href="employees.html" data-translate="nav_employees">Employees</a>
            <a href="restaurant.html" data-translate="nav_rest">Restaurant</a>
            <a href="housekeeping.html" data-translate="nav_house">Housekeeping</a>
            <a href="inventory.html" data-translate="nav_inv">Inventory</a>
            <a href="events.html" data-translate="nav_events">Events</a>
        </div>
        <div class="nav-actions">
            <select class="lang-selector" onchange="applyTranslations(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
            </select>
            <a href="index.html" target="_blank" class="btn-website" data-translate="nav_website">🌐 View Website</a>
            <button class="btn-logout" onclick="logout()" data-translate="btn_logout">Logout</button>
        </div>
    </div>

    <div class="header">
        <h2 data-translate="title_clients">Registered Clients</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchClients()">
            <a href="register-client.html" class="btn" data-translate="btn_add_client">+ Add New Client</a>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th data-translate="th_photo">Photo</th>
            <th data-translate="th_name">Full Name</th>
            <th data-translate="th_contact">Contact</th>
            <th data-translate="th_email">Email</th>
            <th data-translate="th_account">Account/ID</th>
            <th data-translate="th_actions">Actions</th>
        </tr>
        </thead>
        <tbody id="clientTableBody"></tbody>
    </table>
</div>

<!-- MODAL EDITION -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 data-translate="modal_edit">Edit Client</h3>
        <input type="hidden" id="editId">
        <input type="text" id="editName" placeholder="Full Name">
        <input type="text" id="editContact" placeholder="Contact">
        <input type="email" id="editEmail" placeholder="Email">
        <input type="text" id="editAccountNumber" placeholder="Account/ID">
        <button class="btn" style="width: 100%;" onclick="saveEdit()" data-translate="btn_save">Save Changes</button>
    </div>
</div>

<script>
    function logout() { sessionStorage.removeItem('isLoggedIn'); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('preferredLang') || 'en';
        const selector = document.querySelector('.lang-selector');
        if(selector) selector.value = savedLang;
        applyTranslations(savedLang);
        loadAllClients();
    });

    function loadAllClients() {
        fetch('http://localhost:8081/api/clients')
            .then(response => response.json())
            .then(clients => displayClients(clients));
    }

    function searchClients() {
        const searchTerm = document.getElementById('searchInput').value;
        if (searchTerm.trim() === "") { loadAllClients(); return; }
        fetch(`http://localhost:8081/api/clients/search?name=${searchTerm}`)
            .then(response => response.json())
            .then(clients => displayClients(clients));
    }

    function displayClients(clients) {
        const tableBody = document.getElementById('clientTableBody');
        tableBody.innerHTML = '';
        if (clients.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No clients found.</td></tr>';
            return;
        }
        clients.forEach(client => {
            let photoHtml = `<span style="color:#999; font-size:12px;">No Photo</span>`;
            if (client.passportPhoto && client.passportPhoto.trim() !== "") {
                photoHtml = `<img src="${client.passportPhoto}" class="client-img" alt="ID Photo">`;
            }
            // ALIGNEMENT DES BOUTONS
            tableBody.innerHTML += `
                <tr>
                    <td>${client.id}</td>
                    <td>${photoHtml}</td>
                    <td>${client.name}</td>
                    <td>${client.contact}</td>
                    <td>${client.email}</td>
                    <td>${client.accountNumber}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-edit" onclick="openEditModal(${client.id}, '${client.name}', '${client.contact}', '${client.email}', '${client.accountNumber}')">Edit</button>
                            <button class="btn-danger" onclick="deleteClient(${client.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    function openEditModal(id, name, contact, email, accountNumber) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editContact').value = contact;
        document.getElementById('editEmail').value = email;
        document.getElementById('editAccountNumber').value = accountNumber;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    function saveEdit() {
        const id = document.getElementById('editId').value;
        const updatedData = {
            name: document.getElementById('editName').value,
            contact: document.getElementById('editContact').value,
            email: document.getElementById('editEmail').value,
            accountNumber: document.getElementById('editAccountNumber').value,
            passportPhoto: "", authorization: "yes"
        };
        fetch(`http://localhost:8081/api/clients/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updatedData) })
        .then(response => { if (response.ok) { closeModal(); loadAllClients(); alert("Client updated!"); } });
    }

    function deleteClient(id) {
        if (confirm("Delete this client?")) {
            fetch(`http://localhost:8081/api/clients/${id}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) loadAllClients();
                else alert("Cannot delete. Client has reservations.");
            });
        }
    }
</script>
</body>
</html>
