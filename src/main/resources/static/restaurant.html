<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kayaye Royal Hotel - Restaurant</title>
    <script src="translations.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #1a252f; padding: 15px 20px; border-radius: 8px; flex-wrap: wrap;}
        .nav-links { display: flex; flex-wrap: wrap; gap: 15px; align-items: center;}
        .nav-links a { text-decoration: none; color: white; font-weight: bold; font-size: 14px;}
        .nav-links a.active { color: #d4af37; text-decoration: underline; }
        .lang-selector { background: #d4af37; color: #1a252f; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 15px;}
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .btn-website { text-decoration: none; color: #2ecc71; font-weight: bold; font-size: 14px; }
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { border: 1px solid #eee; padding: 20px; border-radius: 8px; }
        h2, h3 { color: #333; margin-top: 0; }
        .form-inline { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-inline input, .form-inline select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .form-inline button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px;}
        th { background-color: #1a252f; color: #d4af37; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <div class="nav-links">
            <a href="dashboard.html" data-translate="nav_dash">Dashboard</a>
            <a href="clients.html" data-translate="nav_clients">Clients</a>
            <a href="rooms.html" data-translate="nav_rooms">Rooms</a>
            <a href="reservations.html" data-translate="nav_bookings">Bookings</a>
            <a href="employees.html" data-translate="nav_employees">Employees</a>
            <a href="restaurant.html" class="active" data-translate="nav_rest">Restaurant</a>
            <a href="housekeeping.html" data-translate="nav_house">Housekeeping</a>
            <a href="inventory.html" data-translate="nav_inv">Inventory</a>
            <a href="events.html" data-translate="nav_events">Events</a>
        </div>
        <div class="nav-actions">
            <select class="lang-selector" onchange="applyTranslations(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
            </select>
            <a href="index.html" target="_blank" class="btn-website" data-translate="nav_website">🌐 View Website</a>
            <button class="btn-logout" onclick="logout()" data-translate="btn_logout">Logout</button>
        </div>
    </div>

    <h2 data-translate="rest_title">Restaurant Management (F&B)</h2>

    <div class="grid-2">
        <div class="card">
            <h3 data-translate="rest_menu">Manage Menu</h3>
            <div class="form-inline">
                <input type="text" id="foodName" placeholder="Food Name" required>
                <input type="number" id="foodPrice" placeholder="Price (FCFA)" required>
                <select id="foodCategory">
                    <option value="Breakfast">Breakfast</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Drink">Drink</option>
                </select>
                <button onclick="addFood()" data-translate="rest_add">Add to Menu</button>
            </div>
            <table>
                <thead><tr><th>ID</th><th data-translate="th_name">Item</th><th data-translate="th_price">Price</th></tr></thead>
                <tbody id="menuTableBody"></tbody>
            </table>
        </div>

        <div class="card">
            <h3 data-translate="rest_order">Take Order</h3>
            <div class="form-inline">
                <select id="orderClientId" required>
                    <option value="">-- Select Client --</option>
                </select>
                <select id="orderFoodId" required>
                    <option value="">-- Select Item --</option>
                </select>
                <input type="number" id="orderQuantity" value="1" min="1" style="width: 60px;">
                <button onclick="placeOrder()" data-translate="rest_btn_order">Order</button>
            </div>
            <h4 data-translate="rest_recent">Recent Orders</h4>
            <table>
                <thead><tr><th data-translate="th_name">Client</th><th data-translate="th_name">Item</th><th data-translate="rest_qty">Qty</th><th data-translate="th_price">Total</th></tr></thead>
                <tbody id="ordersTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function logout() { sessionStorage.removeItem('isLoggedIn'); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('preferredLang') || 'en';
        const selector = document.querySelector('.lang-selector');
        if(selector) selector.value = savedLang;
        applyTranslations(savedLang);
        loadMenu();
        loadClients();
        loadOrders();
    });

    function loadMenu() {
        fetch('http://localhost:8081/api/food')
            .then(res => res.json())
            .then(items => {
                const menuBody = document.getElementById('menuTableBody');
                const select = document.getElementById('orderFoodId');
                menuBody.innerHTML = '';
                select.innerHTML = '<option value="">-- Select Item --</option>';
                items.forEach(item => {
                    menuBody.innerHTML += `<tr><td>${item.id}</td><td>${item.name}</td><td>${item.price} FCFA</td></tr>`;
                    select.innerHTML += `<option value="${item.id}">${item.name} (${item.price} FCFA)</option>`;
                });
            });
    }

    function addFood() {
        const food = {
            name: document.getElementById('foodName').value,
            price: parseFloat(document.getElementById('foodPrice').value),
            category: document.getElementById('foodCategory').value
        };
        fetch('http://localhost:8081/api/food', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(food) })
        .then(res => { if(res.ok) { document.getElementById('foodName').value = ''; document.getElementById('foodPrice').value = ''; loadMenu(); } });
    }

    function loadClients() {
        fetch('http://localhost:8081/api/clients')
            .then(res => res.json())
            .then(clients => {
                const select = document.getElementById('orderClientId');
                clients.forEach(c => { select.innerHTML += `<option value="${c.id}">${c.name} (Room ${c.accountNumber})</option>`; });
            });
    }

    function loadOrders() {
        fetch('http://localhost:8081/api/orders')
            .then(res => res.json())
            .then(orders => {
                const tableBody = document.getElementById('ordersTableBody');
                tableBody.innerHTML = '';
                orders.forEach(o => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${o.client ? o.client.name : 'N/A'}</td>
                            <td>${o.foodItem ? o.foodItem.name : 'N/A'}</td>
                            <td>${o.quantity}</td>
                            <td>${o.totalPrice} FCFA</td>
                        </tr>
                    `;
                });
            });
    }

    function placeOrder() {
        const orderData = {
            clientId: document.getElementById('orderClientId').value,
            foodItemId: document.getElementById('orderFoodId').value,
            quantity: parseInt(document.getElementById('orderQuantity').value)
        };
        fetch('http://localhost:8081/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) })
        .then(res => { if(res.ok) { alert("Order placed!"); loadOrders(); } });
    }
</script>
</body>
</html>
