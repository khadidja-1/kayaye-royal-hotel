<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kayaye Royal Hotel - Employees</title>
    <script src="translations.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        /* MENU PROPRE ET SANS CHEVAUCHEMENT */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #1a252f;
            padding: 15px 20px;
            border-radius: 8px;
            flex-wrap: wrap; /* Permet de passer à la ligne si l'écran est petit */
            gap: 15px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .nav-links a.active {
            color: #d4af37;
            text-decoration: underline;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .lang-selector {
            background: #d4af37;
            color: #1a252f;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-website {
            text-decoration: none;
            color: #2ecc71;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        h2 { color: #333; }
        .form-inline { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-inline input, .form-inline select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .form-inline button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1a252f; color: #d4af37; }
        .btn-danger { background-color: #dc3545; color: white; padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
<div class="container">
    <!-- MENU UNIVERSEL -->
    <div class="nav">
        <div class="nav-links">
            <a href="dashboard.html" data-translate="nav_dash">Dashboard</a>
            <a href="clients.html" data-translate="nav_clients">Clients</a>
            <a href="rooms.html" data-translate="nav_rooms">Rooms</a>
            <a href="reservations.html" data-translate="nav_bookings">Bookings</a>
            <a href="employees.html" class="active" data-translate="nav_employees">Employees</a>
            <a href="restaurant.html" data-translate="nav_rest">Restaurant</a>
            <a href="housekeeping.html" data-translate="nav_house">Housekeeping</a>
            <a href="inventory.html" data-translate="nav_inv">Inventory</a>
            <a href="events.html" data-translate="nav_events">Events</a>
        </div>
        <div class="nav-actions">
            <select class="lang-selector" onchange="applyTranslations(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
            </select>
            <a href="index.html" target="_blank" class="btn-website" data-translate="nav_website">🌐 View Website</a>
            <button class="btn-logout" onclick="logout()" data-translate="btn_logout">Logout</button>
        </div>
    </div>

    <h2 data-translate="title_emp">Staff Management</h2>

    <div class="form-inline">
        <input type="text" id="empName" placeholder="Full Name" required>
        <select id="empRole">
            <option value="Receptionist" data-translate="role_recep">Receptionist</option>
            <option value="Housekeeping" data-translate="role_house">Housekeeping</option>
            <option value="Manager" data-translate="role_manager">Manager</option>
            <option value="Security" data-translate="role_security">Security</option>
        </select>
        <input type="text" id="empPhone" placeholder="Phone Number" required>
        <input type="number" id="empSalary" placeholder="Monthly Salary (FCFA)" required>
        <button onclick="addEmployee()" data-translate="btn_add_emp">Add Employee</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th data-translate="th_name">Name</th>
            <th data-translate="th_role">Role</th>
            <th data-translate="th_phone">Phone</th>
            <th data-translate="th_salary">Salary</th>
            <th data-translate="th_actions">Actions</th>
        </tr>
        </thead>
        <tbody id="employeeTableBody"></tbody>
    </table>
</div>

<script>
    function logout() { sessionStorage.removeItem('isLoggedIn'); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('preferredLang') || 'en';
        const selector = document.querySelector('.lang-selector');
        if(selector) selector.value = savedLang;
        applyTranslations(savedLang);
        loadEmployees();
    });

    function loadEmployees() {
        fetch('http://localhost:8081/api/employees')
            .then(res => res.json())
            .then(employees => {
                const tableBody = document.getElementById('employeeTableBody');
                tableBody.innerHTML = '';
                employees.forEach(emp => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.name}</td>
                            <td>${emp.role}</td>
                            <td>${emp.phone}</td>
                            <td>${emp.salary} FCFA</td>
                            <td><button class="btn-danger" onclick="deleteEmployee(${emp.id})">Delete</button></td>
                        </tr>
                    `;
                });
            });
    }

    function addEmployee() {
        const empData = {
            name: document.getElementById('empName').value,
            role: document.getElementById('empRole').value,
            phone: document.getElementById('empPhone').value,
            salary: parseFloat(document.getElementById('empSalary').value)
        };
        fetch('http://localhost:8081/api/employees', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(empData) })
        .then(response => {
            if(response.ok) {
                document.getElementById('empName').value = ''; document.getElementById('empPhone').value = ''; document.getElementById('empSalary').value = '';
                loadEmployees();
            }
        });
    }

    function deleteEmployee(id) {
        if(confirm("Fire this employee?")) {
            fetch(`http://localhost:8081/api/employees/${id}`, { method: 'DELETE' }).then(res => { if(res.ok) loadEmployees(); });
        }
    }
</script>
</body>
</html>
